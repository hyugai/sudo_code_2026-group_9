[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telesale-agent"
version = "0.1.0"
description = "Extensible agent harness for multi-channel telesale conversations."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "pydantic",
    "gradio",
    "python-dotenv",
    "langchain-groq"
]

[tool.setuptools.packages.find]
where = ["src"]
